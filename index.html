<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Social link profile</title>
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body>
    <!-- ========================= -->
    <!-- PAGE-->
    <!-- ========================= -->
    <main class="page">
      <!-- ========================= -->
      <!-- PROFILE-->
      <!-- ========================= -->
      <article class="profile">
        <img
          class="profile__image"
          src="./assets/images/avatar-jessica.jpeg"
          alt="Avatar image Jessica Randall"
        />

        <header class="profile__header">
          <h1 class="profile__name">Jessica Randall</h1>
          <p class="profile__location">London, United Kingdom</p>
        </header>

        <p class="profile__description">
          "Front-end developer and avid reader."
        </p>

        <ul class="social-links" aria-label="Social media links">
          <li class="social-links__item">
            <a href="#" class="social-links__link">GitHub</a>
          </li>
          <li class="social-links__item">
            <a href="#" class="social-links__link">Frontend Mentor</a>
          </li>
          <li class="social-links__item">
            <a href="#" class="social-links__link">LinkedIn</a>
          </li>
          <li class="social-links__item">
            <a href="#" class="social-links__link">Twitter</a>
          </li>
          <li class="social-links__item">
            <a href="#" class="social-links__link">Instagram</a>
          </li>
        </ul>
      </article>
    </main>
  </body>
</html>
